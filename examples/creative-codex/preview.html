&lt;p&gt;Type designer &amp;amp; creative coder · Berlin / Amman&lt;/p&gt;
&lt;p dir=&quot;rtl&quot; lang=&quot;ar&quot;&gt;تصميم الخطوط والبرمجة الإبداعية · برلين / عمّان&lt;/p&gt;
&lt;p&gt;&lt;img src=&quot;assets/cover.svg&quot; width=&quot;100%&quot; alt=&quot;Letters, tides, print. A typographic cover in teal and fluorescent pink on warm paper.&quot;&gt;&lt;/p&gt;
&lt;h3&gt;01 &amp;nbsp; kufic-grid&lt;/h3&gt;
&lt;p&gt;Arabic and Latin words become square Kufic lettering on a modular grid. A web tool and library, with editable letter-join rules and SVG exports for print and laser cutting.&lt;/p&gt;
&lt;p dir=&quot;rtl&quot; lang=&quot;ar&quot;&gt;أداة ويب ومكتبة لتوليد حروف كوفية مربّعة من كلمات عربية ولاتينية على شبكة وحدات، مع قواعد قابلة للتعديل لوصل الحروف وتصدير بصيغة SVG للطباعة والقص بالليزر.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://github.com/noor-haddad-studio/kufic-grid&quot;&gt;&lt;img src=&quot;assets/kufic-grid.png&quot; width=&quot;100%&quot; alt=&quot;kufic-grid — a square composition of teal and fluorescent-pink modules on warm paper.&quot;&gt;&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://github.com/noor-haddad-studio/kufic-grid&quot;&gt;Explore kufic-grid / استكشف المشروع ↗&lt;/a&gt;&lt;/p&gt;
&lt;br&gt;
&lt;h3&gt;02 &amp;nbsp; Qamar / قمر&lt;/h3&gt;
&lt;p&gt;A variable Arabic/Latin display typeface, moving along a single axis from crescent-thin to full-moon black. Released under the SIL Open Font License.&lt;/p&gt;
&lt;p dir=&quot;rtl&quot; lang=&quot;ar&quot;&gt;خط عرض متغيّر للعربية واللاتينية، بمحور واحد يمتدّ من رقّة الهلال إلى ثقل البدر. متاح بموجب رخصة SIL المفتوحة للخطوط.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://github.com/noor-haddad-studio/qamar-variable&quot;&gt;&lt;img src=&quot;assets/qamar-specimen.png&quot; width=&quot;100%&quot; alt=&quot;Qamar — the supplied teal crescent-to-disc study on warm paper.&quot;&gt;&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://github.com/noor-haddad-studio/qamar-variable&quot;&gt;Explore Qamar / استكشف قمر ↗&lt;/a&gt;&lt;/p&gt;
&lt;br&gt;
&lt;h3&gt;Studies &amp;amp; print / دراسات وطباعة&lt;/h3&gt;
&lt;p&gt;&lt;b&gt;Tide Sketches.&lt;/b&gt; A daily practice: 120 p5.js sketches about water moving under the moon. Each sketch begins with a seed and a few rules.&lt;/p&gt;
&lt;p dir=&quot;rtl&quot; lang=&quot;ar&quot;&gt;&lt;b&gt;دراسات المدّ والجزر.&lt;/b&gt; ممارسة يومية تضمّ ١٢٠ دراسة باستخدام p5.js عن حركة الماء تحت القمر. تبدأ كلّ دراسة ببذرة وقواعد قليلة.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://github.com/noor-haddad-studio/tide-sketches&quot;&gt;&lt;img src=&quot;assets/tide-sketches.png&quot; width=&quot;100%&quot; alt=&quot;Tide Sketches — fine teal and pink wave lines cross over a warm-paper field.&quot;&gt;&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://github.com/noor-haddad-studio/tide-sketches&quot;&gt;Browse Tide Sketches / تصفّح الدراسات ↗&lt;/a&gt;&lt;/p&gt;
&lt;br&gt;
&lt;p&gt;&lt;b&gt;riso-sep.&lt;/b&gt; Separate an image into two to four risograph spot-colour layers, with halftone and trapping options.&lt;/p&gt;
&lt;p dir=&quot;rtl&quot; lang=&quot;ar&quot;&gt;أداة لفصل الصور إلى طبقتين إلى أربع طبقات من الألوان الموضعية لطباعة الريزوغراف، مع خيارات التنقيط النصفي وتداخل حواف الألوان.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://github.com/noor-haddad-studio/riso-sep&quot;&gt;Explore riso-sep / استكشف الأداة ↗&lt;/a&gt;&lt;/p&gt;
&lt;br&gt;
